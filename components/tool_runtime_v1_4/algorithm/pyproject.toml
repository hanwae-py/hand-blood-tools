[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pnu-surgical-tool"
version = "1.1.0rc1"
description = "PNU CVLAB standalone RF-DETR surgical-tool recognition and constrained pose"
readme = "README_KO.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.8,<5",
  "torch>=2.5,<2.8",
  "torchvision>=0.20,<0.23",
  "rfdetr==1.8.3",
]

[tool.setuptools.packages.find]
where = ["src"]
