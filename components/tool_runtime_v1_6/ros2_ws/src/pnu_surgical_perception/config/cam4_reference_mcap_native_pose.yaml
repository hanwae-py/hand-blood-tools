/**:
  ros__parameters:
    # Reference MCAP transport. Deployment topic names remain configurable.
    camera: "cam_4"
    rgb_topic: "/synced/cam_4/color/image_raw/compressed"
    color_camera_info_topic: "/synced/cam_4/color/camera_info"
    depth_topic: "/synced/cam_4/depth/image_rect_raw/compressedDepth"
    depth_camera_info_topic: "/synced/cam_4/depth/camera_info"
    extrinsics_topic: "/synced/cam_4/extrinsics/depth_to_color"
    require_extrinsics_topic: true
    maximum_stamp_delta_ns: 1000000
    sync_queue_size: 8
    latest_frame_only: true
    require_depth: true

    pose_topic: "/perception/cam_4/tool/poses"
    observation_topic: "/perception/cam_4/tool/observations"
    overlay_topic: "/perception/cam_4/tool/overlay/compressed"
    pose_overlay_topic: "/perception/cam_4/tool/pose_overlay/compressed"
    diagnostics_topic: "/perception/cam_4/tool/diagnostics"
    health_topic: "/perception/cam_4/tool/health"
    view: "cam_4"
    workspace_zone: "mayo"

    confidence_threshold: 0.3
    class_confidence_threshold_names: ["Adson Forceps"]
    class_confidence_threshold_values: [0.3]
    enable_class_agnostic_nms: true
    class_agnostic_nms_iou: 0.8

    # The matching dataset ROI is loaded as a separate launch profile.
    workspace_roi_profile: "none"
    workspace_roi_enabled: false
    workspace_roi_polygon_norm_xy:
      - 0.0
      - 0.0
      - 1.0
      - 0.0
      - 1.0
      - 1.0
      - 0.0
      - 1.0
    workspace_roi_minimum_mask_overlap: 0.5
    workspace_roi_require_mask_centroid_inside: true
    temporal_class_smoothing_enabled: true
    temporal_class_history_size: 7
    temporal_class_minimum_switch_frames: 3
    temporal_class_switch_score_margin: 0.2
    temporal_association_minimum_mask_iou: 0.1
    temporal_association_minimum_bbox_iou: 0.2
    temporal_association_maximum_centroid_distance_norm: 0.06
    temporal_association_maximum_mask_area_ratio: 3.0
    temporal_track_max_missed_frames: 3
    pose_axis_length_m: 0.05
    optimize_for_inference: true
    jit_compile: true
    fp16: true
    jpeg_quality: 90

    # 0.001 m/unit is plausible for the bag but absent from its metadata.
    # Keep verified=false until the camera provider confirms the device value.
    depth_scale_m_per_unit: 0.001
    depth_scale_verified: false
    minimum_depth_m: 0.05
    maximum_depth_m: 10.0

    # P_color = R_color_from_depth * P_depth + t_color_from_depth.
    # Extracted from /synced/cam_4/extrinsics/depth_to_color in the reference
    # bag. This reference is checked only; 3D runtime requires the latched
    # topic and never silently falls back to this stored transform.
    # The ROS message is explicitly column-major.
    depth_to_color_rotation_convention: "column_major"
    depth_to_color_rotation:
      - 0.9999935626983643
      - -0.0015063914470374584
      - -0.0032486612908542156
      - 0.0014905486023053527
      - 0.999987006187439
      - -0.004873663652688265
      - 0.003255960764363408
      - 0.004868790041655302
      - 0.9999828338623047
    depth_to_color_translation_m:
      - -0.059281326830387115
      - -0.000027586851501837373
      - 0.00048295879969373345
    minimum_depth_to_color_baseline_m: 0.02
    maximum_depth_to_color_baseline_m: 0.12
    expected_depth_to_color_translation_direction: [-1.0, 0.0, 0.0]
    minimum_depth_to_color_direction_cosine: 0.95
    depth_to_color_rotation_orthonormal_tolerance: 0.0001
    depth_to_color_rotation_determinant_tolerance: 0.0001
    expected_color_frame: "cam_4_color_optical_frame"
    expected_depth_frame: "cam_4_depth_optical_frame"
    calibration_version: "reference_mcap_20260814_cam4_provisional"

    # Estimated from blue, depth-valid pixels in the first reference-bag frame.
    # Recalibrate this plane at the actual fixed camera/Mayo installation.
    support_plane_normal:
      - 0.04967945869867935
      - 0.06010054902002815
      - -0.9969553026043332
    support_plane_offset_m: 0.7951867203215164
    support_plane_config_version: "reference_mcap_first_frame_blue_plane_provisional"
    support_plane_inlier_ratio: 0.7407333333333334
    support_plane_residual_p95_m: 0.00548064783090434
